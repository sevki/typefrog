name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build all crates
        run: cargo build --verbose --workspace
      - name: Run tests for all crates
        run: cargo test --verbose --workspace
