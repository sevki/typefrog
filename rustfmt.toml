# Rustfmt configuration for typefrog
# See https://rust-lang.github.io/rustfmt/ for all options

# Stable options
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"

# Nightly options (commented out - enable if using nightly rustfmt)
# imports_granularity = "Crate"
# reorder_imports = true
# group_imports = "StdExternalCrate"
# format_code_in_doc_comments = true
# wrap_comments = true
# format_strings = true
# format_macro_matchers = true