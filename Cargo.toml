[package]
name = "typefrog"
version = "0.1.0"
edition = "2021"

[workspace]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Clippy configuration
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Enable clippy pedantic lints but allow some exceptions
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some pedantic lints that are too noisy for this codebase
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

# Custom lints for better code quality
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "warn"

[dependencies]
argh = "0.1.13"
ascent = "0.8.0"
convert_case = "0.8.0"
insta = "1.43.1"
lazy_static = "1.5.0"
okstd = "2.0.1"
prettyplease = "0.2.37"
proc-macro2 = "1.0.101"
quote = "1.0.40"
rustc-hash = "2.1.1"
tokio = { version = "1.47.1", features = ["full"] }
typedb-driver = { version = "3.4.4", features = ["sync"] }
typeql = "3.2.0"

[dev-dependencies]
syn = "2.0.106"
cargo-llvm-cov = "0.6"
